name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger, added 2026-08-20 for one reason: checking that the concurrency group below still
  # holds requires two runs overlapping, and without this the only way to cause a second run is a
  # second commit. **It takes effect only once this file is on the default branch** — GitHub reads
  # `workflow_dispatch` from `main`, not from the branch under test — so the first such check still
  # cost two pushes.
  workflow_dispatch:

# The integration check writes to two shared fixture rows in gymlog-test. fileParallelism: false
# serialises files within a run and does nothing across runs, so two overlapping runs would race:
# run X's assertion 7 (A's timezone mutated) against run Y's assertion 1 (A's timezone is default).
#
# The group is CONSTANT, not ${{ github.ref }}: the shared resource is a pair of database rows, not
# a branch. A ref-scoped group leaves a push to main and a pull_request run in different groups —
# different refs — racing over the same two rows, which is the exact interleaving this exists to
# prevent. cancel-in-progress: false matters as much: cancelling mid-suite is how a fixture row
# gets left holding a test value.
concurrency:
  group: gymlog-test-fixtures
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run typecheck
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - run: npm test
      # Renders pages through Astro's container and asserts against the resulting HTML. Hermetic —
      # no network, no credential — and separate from `npm test` because it is the one suite that
      # loads Astro's Vite pipeline, which the unit config deliberately does not (AGENTS.md
      # § Testing). It is in the gate because it holds the ONLY check that would notice the 418-entry
      # timezone list crossing into island props, and a check outside the gate rots.
      - run: npm run test:render
      # Against gymlog-test only. No production credential is present on this step, by design:
      # the blast radius of a bad check is a project holding no real data.
      - run: npm run test:integration
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          GYMLOG_TEST_PASSWORD: ${{ secrets.GYMLOG_TEST_PASSWORD }}
      # The fourth Vitest project. It is the only thing in this repository that executes
      # `src/middleware.ts` or `src/lib/supabase.ts` at all — every other suite hands a handler a
      # hand-built `locals`, so the client and the user id agree by construction and a middleware
      # binding the WRONG identity to a request is invisible to all of them. Writes to gymlog-test,
      # and is inside the concurrency group above BECAUSE it lives in this job.
      - run: npm run test:middleware
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          GYMLOG_TEST_PASSWORD: ${{ secrets.GYMLOG_TEST_PASSWORD }}
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Chromium only: risk #4 asks whether islands hydrate, and three engines would triple the
      # cost of this step for no additional signal.
      - run: npx playwright install --with-deps chromium
      # The browser layer, and it answers the one question the other four runners cannot: does a
      # screen that renders correctly also DO anything? Every island is `client:load`.
      #
      # **NO PRODUCTION CREDENTIAL ON THIS STEP, and that is the guarantee rather than an omission.**
      # `npm run test:e2e` rebuilds through scripts/e2e-build.mjs, and both env vars are declared
      # optional, so the build succeeds without them and the served worker is handed the test pair by
      # scripts/e2e-serve.mjs alone. If that launcher is ever bypassed the credentials are ABSENT, not
      # production's — every protected route redirects and this step goes red on its first assertion.
      - run: npm run test:e2e
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_KEY: ${{ secrets.SUPABASE_TEST_KEY }}
          GYMLOG_TEST_PASSWORD: ${{ secrets.GYMLOG_TEST_PASSWORD }}
